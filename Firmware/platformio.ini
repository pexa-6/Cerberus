; ============================================================
; Cerberus - тестовая прошивка (Display + Buttons + Buzzer + SD)
; ============================================================
;
; Важное отличие от Arduino IDE: TFT_eSPI здесь настраивается НЕ
; через User_Setup.h внутри библиотеки, а через build_flags ниже.
; Это удобнее - настройки едут вместе с проектом в git/архиве и не
; теряются при обновлении библиотеки. USER_SETUP_LOADED=1 говорит
; TFT_eSPI игнорировать свой собственный User_Setup.h и использовать
; эти флаги вместо него.

[env:cerberus]
platform = espressif32@6.12.0
; platform = espressif32
; board = cerberus_esp32s3_n16r8
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Если PlatformIO определит не тот порт автоматически, раскомментируй
; и укажи свой COM-порт (Windows) или /dev/ttyUSB0 (Linux):
; upload_port = COM8
; monitor_port = COM8

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1

    -DUSE_HSPI_PORT=1
    -DTFT_MISO=-1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=14
    -DTFT_RST=-1

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
